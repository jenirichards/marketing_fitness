<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Harbour Fitness · Option B "Ascent" · horizontal lockup (light backgrounds).
     For dark backgrounds swap the two text fills to #ffffff and #f59e0b. -->
<svg viewBox="0 0 320 64" width="320" height="64" xmlns="http://www.w3.org/2000/svg">
  <g>
    <rect x="4" y="8" width="48" height="48" rx="11" fill="#12233f" />
    <g transform="translate(4,8) scale(0.75)">
      <rect x="13" y="38" width="9" height="14" rx="4.5" fill="#ffffff" opacity="0.45" />
      <rect x="27.5" y="28" width="9" height="24" rx="4.5" fill="#ffffff" opacity="0.8" />
      <rect x="42" y="14" width="9" height="38" rx="4.5" fill="#f59e0b" />
    </g>
  </g>
  <text x="66" y="41"
        font-family="'Archivo', 'Geist', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#0b1220">Harbour</tspan><tspan fill="#b45309">Fitness</tspan>
  </text>
</svg>
